name: Nanoid Audit Fix

on:
  push:
    branches:
      - BA-WEB-014-product-alignment

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[nanoid-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: BA-WEB-014-product-alignment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply npm security lockfile fix
        run: npm audit fix --package-lock-only
      - name: Commit security lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "BA-WEB-014 Fix nanoid audit finding [nanoid-fix]"
          git push origin HEAD:BA-WEB-014-product-alignment
